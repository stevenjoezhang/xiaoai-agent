name: ARMv7 build

on:
  push:
    branches:
      - feature/music-mcp-routing
    paths:
      - "xiaoai-agent/**"
      - ".github/workflows/armv7-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armv7-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiaoai-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xiaoai-agent
      - name: Run tests and diagnose lockfile
        run: |
          set +e
          cargo test
          test_status=$?
          echo "===== CARGO.LOCK DIFF AFTER TEST ====="
          git diff -- Cargo.lock
          exit "$test_status"

  build-armv7:
    name: Build ARMv7 musl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiaoai-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xiaoai-agent
      - name: Install cross
        run: cargo install cross --locked
      - name: Build release binary
        run: cross build --locked --release --target armv7-unknown-linux-musleabihf
      - name: Upload ARMv7 binary
        uses: actions/upload-artifact@v4
        with:
          name: xiaoai-agent-armv7-musleabihf
          path: xiaoai-agent/target/armv7-unknown-linux-musleabihf/release/xiaoai-agent
          if-no-files-found: error
          retention-days: 14
