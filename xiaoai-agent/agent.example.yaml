runtime:
  speech_socket: /tmp/mico_aivs_lab/usock/speech.usock
  session_idle_timeout_s: 20

device:
  tts_command: "/usr/sbin/tts_play.sh --notify-pns {text}"
  play_url_command: "killall miplayer 2>/dev/null; miplayer -f {url} >/tmp/xiaoai-miplayer.log 2>&1 &"
  stop_audio_command: "killall tts_play.sh miplayer 2>/dev/null; mphelper pause"
  pause_audio_command: "mphelper pause 2>/dev/null || true; for p in $(pidof miplayer 2>/dev/null); do kill -STOP \"$p\" 2>/dev/null || true; done"
  resume_audio_command: "for p in $(pidof miplayer 2>/dev/null); do kill -CONT \"$p\" 2>/dev/null || true; done; mphelper play 2>/dev/null || true"
  duck_audio_command: "amixer sget mysoftvol | awk -F'[][]' '/%/ {print $2; exit}' | tr -d '%' >/tmp/xiaoai-mysoftvol.before; amixer sset mysoftvol 25% >/dev/null 2>&1 || true"
  unduck_audio_command: "v=$(cat /tmp/xiaoai-mysoftvol.before 2>/dev/null); if [ -n \"$v\" ]; then amixer sset mysoftvol \"${v}%\" >/dev/null 2>&1 || true; fi; rm -f /tmp/xiaoai-mysoftvol.before"
  abort_command: "killall tts_play.sh miplayer 2>/dev/null; mphelper pause 2>/dev/null || true; ubus call mediaplayer media_control '{\"player\":\"mediaplayer\",\"action\":\"pause\",\"volume\":0}' 2>/dev/null || true; ubus call mediaplayer player_play_operation '{\"media\":\"app_ios\",\"action\":\"stop\"}' 2>/dev/null || true"
  led_enabled: true
  led_listening: 3
  led_user_speaking: 4
  led_thinking: 2
  led_speaking: 5

capture:
  # mipns provides 16 kHz mono signed 16-bit little-endian PCM.
  sample_rate: 16000
  threshold: 0.006
  mic_gain: 1.0
  block_ms: 100
  pre_roll_ms: 300
  silence_ms: 1500
  min_speech_ms: 300
  max_utterance_s: 15.0
  cooldown_s: 0.7

asr:
  # open_ai or openai_realtime
  provider: open_ai

  # OpenAI-compatible ASR settings. Used when provider is open_ai.
  open_ai:
    base_url: https://api.openai.com/v1
    api_key: EMPTY
    model: whisper-1
    language: zh
    prompt: ""
    timeout_s: 5
    retries: 1

  # OpenAI Realtime transcription WebSocket settings. Used when provider is openai_realtime.
  openai_realtime:
    base_url: https://api.openai.com/v1
    api_key: EMPTY
    model: gpt-realtime-whisper
    # FunASR's realtime Paraformer and FSMN-VAD both require 16 kHz mono PCM.
    target_sample_rate: 16000
    chunk_ms: 200
    timeout_s: 10
    retries: 1
    # Let the ASR service decide speech boundaries and emit speech_started /
    # speech_stopped. Disable only for an OpenAI-compatible service without VAD.
    server_vad:
      enabled: true
      prefix_padding_ms: 300
      silence_duration_ms: 1200
      threshold: 0.5

llm:
  # anthropic or open_ai_chat
  protocol: anthropic
  base_url: https://api.openai.com/v1
  api_key: EMPTY
  model: gpt-5.4-mini
  timeout_s: 10
  max_tokens: 300
  retries: 1
  temperature: 0.5
  thinking:
    # auto, disabled, or enabled. Anthropic enabled mode also uses budget_tokens.
    mode: disabled
    budget_tokens: 1024

agent:
  timezone: Asia/Shanghai
  weather:
    qweather_url: ""
    default_location: ""
    ip_lookup_url: https://ipapi.co/json/
    timeout_s: 5
  web_search:
    enabled: false
    tavily_url: https://api.tavily.com/search
    api_key: ""
    timeout_s: 10
    max_results: 3
    search_depth: basic

mcp:
  servers:
  - name: home_assistant
    enabled: false
    url: http://homeassistant.local:8123/api/mcp
    token: ""
    timeout_s: 10
    # Empty means expose every tool from this server.
    tools: []

music:
  enabled: false
  provider: navidrome
  interruption:
    # pause, duck, or none. duck uses device.duck_audio_command / unduck_audio_command.
    mode: pause
  netease:
    # External Netease API service URL. The speaker does not start this service locally.
    api_base_url: http://127.0.0.1:3300
    login_mode: captcha
    account: ""
    phone: ""
    password: ""
    md5_password: ""
    # Optional read-only seed cookie. Login refreshes are kept in memory and are not written back.
    cookie_file: null
    default_level: standard
    timeout_s: 5
    login_on_start: true
  navidrome:
    base_url: http://127.0.0.1:4533
    username: ""
    password: ""
    api_version: 1.16.1
    timeout_s: 5

airplay:
  enabled: false
  name: XiaoAI AirPlay
  port: 5000
  password: ""
  # Optional stable 6-byte identity, for example c2:46:38:ad:3e:25.
  hwaddr: ""
  output:
    backend: aplay
    aplay_path: /usr/bin/aplay
    device: default
    format: S16_LE
  interruption:
    # none or duck. duck lowers only AirPlay PCM gain while the voice agent is active.
    mode: duck
    duck_gain: 0.25
